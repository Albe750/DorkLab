[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorklab"
version = "1.6.2"
description = "Ricerca avanzata, estrazione documentale e protective dorking con interfaccia grafica"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Albe750" }]
keywords = ["osint", "google-dorks", "ghdb", "security", "gui", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.28",
]

[project.optional-dependencies]
# Motore Claude: FACOLTATIVO. Il motore funziona anche senza, via HTTP diretto
# (usa 'requests', gia' richiesto). Installa l'SDK solo se lo preferisci.
claude = ["anthropic>=0.40"]
# Metadati PDF piu' completi
pdf = ["pypdf>=4.0"]
all = ["anthropic>=0.40", "pypdf>=4.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Albe750/DorkLab"
Issues = "https://github.com/Albe750/DorkLab/issues"

[project.scripts]
dorklab = "dorklab.__main__:main"

[tool.setuptools.packages.find]
include = ["dorklab*"]

[tool.setuptools.package-data]
dorklab = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
